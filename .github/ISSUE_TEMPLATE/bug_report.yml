name: Bug Report
description: Report an issue, calculation anomaly, or bug in Procure Sherpa
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Procure Sherpa is a client-only, offline-first tool.
        Please confirm that your issue reproduces in the single-file release artifact or development build.

  - type: input
    id: route
    attributes:
      label: Route or Feature
      description: The hash route where the problem occurred (e.g., `#/calc/calc-tco`, `#/academy`, `#/sop/sop-rfq`).
      placeholder: "#/calc/calc-tco"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description of the Bug
      description: A clear and concise description of what went wrong.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this behavior?
      value: |
        1. Open Procure Sherpa in browser
        2. Navigate to '...'
        3. Enter inputs '...'
        4. Observe behavior '...'
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser & OS
      description: Which browser (Chrome, Edge, Firefox, Safari) and operating system did you use?
      placeholder: "Chrome 128 / Windows 11"
    validations:
      required: true
