name: QA

# Runs on every push and pull request to main, plus a weekly scheduled run
# and on-demand dispatch.
#
# This used to be weekly-only, on the reasoning that the repo ships a single
# generated HTML file and the full gate is a release concern. That reasoning
# did not survive contact with the failure mode it allowed: a broken commit
# could sit on main for up to seven days, and the badge said "passing" the
# whole time. The suite takes a few minutes; a week of unverified main is not
# worth saving them.
#
# The weekly run is kept for a different purpose: it catches environment
# drift (a new Node minor, a transitive dev-dependency change) on a
# codebase that may not have been touched in a while.
#
# ---------------------------------------------------------------------------
# HOW THIS WORKFLOW FAILS, AND WHAT EACH FAILURE MEANS
# ---------------------------------------------------------------------------
# The jobs run on GitHub-hosted `ubuntu-latest` runners, which are free for
# public repositories and always allocated. They did not always: this
# workflow used to run on a self-hosted workstation because hosted minutes
# on this account were believed to be blocked by the spending limit, and
# when that workstation went offline the jobs simply queued - the scheduled
# run of 2026-10-26 was cancelled after 24h0m2s having executed nothing.
# On 2026-11-03 a canary run (41547617809, on this same suite) executed on
# `ubuntu-latest` and passed in under two minutes, so the allocation block
# is gone and the workflows moved to hosted runners the same day.
#
# A job that cannot get a runner still looks like a run that is simply
# queued, and it can sit that way until GitHub's own 24-hour limit cancels
# it. That failure mode is not gone, it is just no longer the expected
# state. `timeout-minutes` below bounds the part this file can control:
# once a job has a runner, it cannot run for more than 30 minutes. The
# full gate takes a few minutes, so 30 is generous headroom and still an
# order of magnitude below GitHub's six-hour job default. What to do if
# runs start queueing again is recorded in CONTRIBUTING.md under
# "CI is green because nothing ran".
#
# Steps that are not part of the gate are marked as such, so an account
# condition (an artifact storage quota, say) cannot turn a verified commit
# into a red run.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

# A newer push to the same branch makes an in-flight run obsolete. Scheduled
# runs share the group, so a weekly drift check that is still queued when
# somebody pushes is cancelled rather than left to stack up behind it.
concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

# The QA job builds, lints and runs the whole suite. It needs to read the
# repository and nothing else, and GitHub's default token scope for a
# repository is whatever the owner last set on the org - which is usually
# read AND write. A job that never pushes should not carry a credential that
# can. Declared per workflow so a future job inherits the narrow scope rather
# than the account default.
permissions:
  contents: read

jobs:
  qa:
    # A fork's pull request does not run: the job would check a stranger's
    # code out and execute `npm ci` and every test tool against it. On an
    # ephemeral hosted VM that is not the remote-code-execution hazard it
    # was on the owner's workstation, but it still spends the repository's
    # Actions minutes on untested-by-us code, so the skip stays as
    # defense in depth. A skipped job makes the run conclude "success",
    # which the Deploy workflow used to read as a green light - so
    # deploy.yml no longer trusts a conclusion alone. Both halves are
    # required; tools/check_workflows.mjs fails the local gate if either
    # is removed.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # GitHub-hosted runners: ephemeral, always allocated, free for public
    # repositories. Every step is Node-based by design, so the OS does not
    # matter to the suite.
    runs-on: ubuntu-latest
    # Bounded: a hung step fails the run instead of eating the 24-hour limit.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Must match engines.node and .nvmrc. tools/check_workflows.mjs
          # fails the local gate if the pin and the declared engine diverge.
          node-version: 22
          cache: npm

      - name: Install dependencies
        timeout-minutes: 10
        run: npm ci

      # Deliberately before anything that could fail for the wrong reason.
      # On a runner whose Node is stale, or whose node_modules did not
      # install, the suite's first symptom is a stack trace from inside
      # node_modules or "ESLint couldn't find a configuration file" from a
      # system ESLint 6 on PATH. This step says what is actually wrong.
      - name: Preflight the toolchain
        run: node tools/preflight.mjs

      # qa:ci is preflight -> check:drift -> qa, in that order, and the order
      # matters: `npm run qa` starts with `node build.mjs`, which would
      # regenerate ProcureSherpa-v2.0.html and silently erase exactly the
      # mismatch the drift check exists to catch. Calling `npm run qa`
      # directly from a workflow is the mistake this file has made before,
      # which is why the step name and the tool are both spelled out.
      - name: Full QA suite
        run: npm run qa:ci

      # The artifact is a convenience: a copy of the deploy build for
      # anyone who wants to look at it without building it. It is NOT
      # part of the gate, and it must not be able to fail the gate.
      #
      # It was able to, and it did: GitHub's artifact storage quota is
      # tied to the same account billing that intermittently blocks
      # hosted runner allocation, and when the quota is exhausted the
      # upload fails with "Artifact storage quota has been hit" - after
      # the whole suite has passed. A storage quota is an account
      # condition, not a code condition, so it is reported and not
      # enforced.
      - name: Upload deploy build
        if: success()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: procure-sherpa-dist
          path: dist/
          retention-days: 14
