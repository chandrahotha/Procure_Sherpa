name: Deploy

# The Vercel Git integration is connected to this repository, and Vercel
# creates a deployment for every push to main. On the Hobby plan every one
# of them is blocked before a build starts:
#
#   "The deployment was blocked because the commit author doesn't have
#    permission to create deployments for this project."
#   (seatBlock: TEAM_ACCESS_REQUIRED)
#
# The cause is the plan, not the repository. Hobby teams may not have
# members, and the check Vercel runs on a Git-triggered deployment is
# whether the commit author maps to an account with team access. A
# deployment pushed from a token is attributed to the token's owner, who
# is the team owner, so it is not subject to that check.
#
# This workflow is the release path. It needs one repository secret:
#
#   VERCEL_TOKEN  a Vercel API token scoped to the Digi Tracks team
#                 (Vercel dashboard, Settings, Tokens, Create Token)
#
# The job is skipped rather than failed when the secret is not set, so
# the repository stays usable without one, and a release can still be
# made from a workstation with `npm run deploy`.
#
# To make the native Git integration work instead, link the GitHub
# account to the Vercel account (Vercel dashboard, Account Settings,
# Connections, GitHub). That is a one-time change and needs no workflow.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    # Skipped, not failed, when no token is configured.
    if: ${{ secrets.VERCEL_TOKEN != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The deploy script runs the full gate itself: build, lint,
      # referential integrity, calculator assertions, content and quiz
      # gates, route smoke, the integrity gate, security, accessibility
      # and the measured performance budget, then the minified build
      # verified with the same suite. A release can never ship an
      # artifact that has not passed the same checks.
      - name: Build, verify and deploy
        run: node tools/deploy.mjs
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Verify the production URL
        run: |
          curl -fsS -o /dev/null -w "procuresherpa.vercel.app -> HTTP %{http_code}\n" https://procuresherpa.vercel.app
