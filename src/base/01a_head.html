<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Procure Sherpa: enterprise digital learning platform and operational execution system for procurement professionals: interactive learning journeys, controlled SOPs, decision guides, compliance checklists, production templates, financial calculators, and value KPIs.">
<meta name="application-name" content="Procure Sherpa">
<meta name="theme-color" content="#4f46e5">
<title>Procure Sherpa | Procurement Digital Learning Platform</title>
<style>
/* ==========================================================
   Procure Sherpa v2.0 - Design System
   Section 1: tokens
   ========================================================== */
:root{
  --font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --bg:#f3f5fa; --panel:#ffffff; --panel-2:#f8fafd; --sunken:#edf1f7;
  --text:#0f172a; --dim:#3f4c63; --mute:#6b7a90;

  --accent:#4f46e5; --accent-2:#4338ca; --accent-3:#7c3aed; --accent-ink:#ffffff; --accent-soft:#eef0fe;
  --ring:0 0 0 3px rgba(79,70,229,.18);
  --ok:#047857; --ok-2:#059669; --ok-soft:#e4f6ee;
  --warn:#b45309; --warn-2:#d97706; --warn-soft:#fdf0dd;
  --danger:#dc2626; --danger-2:#ef4444; --danger-soft:#fdecec;

  --kb:#7c5cff; --kb-soft:#efeaff; --kb-gradient:linear-gradient(135deg,#7c5cff 0%,#a855f7 100%);
  --sop:#2563eb; --sop-soft:#e7efff; --sop-gradient:linear-gradient(135deg,#2563eb 0%,#3b82f6 100%);
  --cl:#059669; --cl-soft:#e2f6ea; --cl-gradient:linear-gradient(135deg,#059669 0%,#10b981 100%);
  --tpl:#d97706; --tpl-soft:#faf0dd; --tpl-gradient:linear-gradient(135deg,#d97706 0%,#f59e0b 100%);
  --calc:#0d9488; --calc-soft:#dcf4f1; --calc-gradient:linear-gradient(135deg,#0d9488 0%,#14b8a6 100%);
  --dec:#db2777; --dec-soft:#fbe9f4; --dec-gradient:linear-gradient(135deg,#db2777 0%,#f43f5e 100%);
  --kpi:#ea580c; --kpi-soft:#fdf0dc; --kpi-gradient:linear-gradient(135deg,#ea580c 0%,#f97316 100%);
  --scen:#7c3aed; --scen-soft:#fdeae0; --scen-gradient:linear-gradient(135deg,#7c3aed 0%,#a855f7 100%);

  --sh:0 1px 2px rgba(16,24,40,.05);
  --sh-1:0 2px 6px rgba(16,24,40,.06),0 12px 28px rgba(16,24,40,.09);
  --sh-2:0 16px 48px rgba(16,24,40,.18);
  --sh-glow:0 0 0 1px rgba(79,70,229,.15),0 4px 14px rgba(79,70,229,.12);
  --side:280px; --top:64px;
}
html[data-theme="dark"]{

  --scen:#f5a76f; --scen-soft:#3c2214; --scen-gradient:linear-gradient(135deg,#f5a76f 0%,#fdba74 100%);
  --gloss:#cbd5e1; --gloss-soft:#1e293b; --gloss-gradient:linear-gradient(135deg,#cbd5e1 0%,#e2e8f0 100%);
  --academy:#a5b4fc; --academy-soft:#2a2350; --academy-gradient:linear-gradient(135deg,#a5b4fc 0%,#c4b5fd 100%);

  --sh:0 1px 2px rgba(0,0,0,.5);
  --sh-1:0 2px 10px rgba(0,0,0,.5),0 14px 32px rgba(0,0,0,.45);

  --sh-glow:0 0 0 1px rgba(129,140,248,.2),0 4px 14px rgba(129,140,248,.15);
}
