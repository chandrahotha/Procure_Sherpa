<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Procure Sherpa: enterprise digital learning platform and operational execution system for procurement professionals: interactive learning journeys, controlled SOPs, decision guides, compliance checklists, production templates, financial calculators, and value KPIs.">
<meta name="application-name" content="Procure Sherpa">

<title>Procure Sherpa | Procurement Digital Learning Platform</title>
<style>
/* ==========================================================
   Procure Sherpa v2.0 - Design System
   Section 1: tokens
   ========================================================== */
:root{
  --font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --bg:#f3f5fa; --panel:#ffffff; --panel-2:#f8fafd; --sunken:#edf1f7;
  --text:#0f172a; --dim:#3f4c63; --mute:#6b7a90;
  --border:#e2e8f2; --border-2:#c7d2e3;
  --accent:#4f46e5; --accent-2:#4338ca; --accent-ink:#ffffff; --accent-soft:#eef0fe;
  --ring:0 0 0 3px rgba(79,70,229,.18);
  --ok:#047857; --ok-soft:#e4f6ee;
  --warn:#b45309; --warn-soft:#fdf0dd;
  --danger:#dc2626; --danger-soft:#fdecec;
  --info:#0284c7; --info-soft:#e4f3fb;
  --r:14px; --r-sm:10px; --r-lg:22px; --r-pill:999px;
  --sh:0 1px 2px rgba(16,24,40,.05);
  --sh-1:0 2px 6px rgba(16,24,40,.06),0 12px 28px rgba(16,24,40,.09);
  --sh-2:0 16px 48px rgba(16,24,40,.18);
  --side:280px; --top:64px;
}
html[data-theme="dark"]{
  --bg:#090e1a; --panel:#101829; --panel-2:#152036; --sunken:#070c16;
  --text:#e9eefb; --dim:#a9b8d4; --mute:#7d8cab;
  --border:#223050; --border-2:#35496f;
  --accent:#818cf8; --accent-2:#6366f1; --accent-ink:#ffffff; --accent-soft:rgba(129,140,248,.14);
  --ring:0 0 0 3px rgba(129,140,248,.25);
  --ok:#34d399; --ok-soft:#0f2a20;
  --warn:#fbbf24; --warn-soft:#2b2113;
  --danger:#f87171; --danger-soft:#2d1614;
  --info:#38bdf8; --info-soft:#0f2634;
  --sh:0 1px 2px rgba(0,0,0,.5);
  --sh-1:0 2px 10px rgba(0,0,0,.5),0 14px 32px rgba(0,0,0,.45);
  --sh-2:0 16px 48px rgba(0,0,0,.6);
}
