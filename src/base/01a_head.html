<style>
/* ==========================================================
   Procure Sherpa v3.0 - Design System
   Section 1: design tokens

   The v3 identity is an editorial one: a warm-neutral canvas,
   white paper surfaces, one jade accent, and a dark navigation
   rail that stays the same in both themes so the sidebar reads
   as furniture rather than as a panel that happens to be on the
   left. Type is larger and the reading measure is capped, because
   this product is mostly long prose about professional work.
   ========================================================== */
:root{
  --font:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,BlinkMacSystemFont,Roboto,"Helvetica Neue","Noto Sans","DejaVu Sans",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"DejaVu Sans Mono","Liberation Mono",monospace;
  /* A serif for prose and lesson headlines only, never for dashboard chrome.
     Every family here ships with the OS or with a default Linux font pack,
     because the artifact is offline and fetches nothing: no webfont can be
     assumed, so the stack names what is actually installed. */
  --font-read:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"DejaVu Serif",serif;

  --bg:#f4f5f3; --bg-2:#eceeeb; --panel:#ffffff; --panel-2:#f8faf8; --sunken:#eef1ef;
  --text:#11151c; --dim:#39424f; --mute:#69737f;
  --border:#e2e6e4; --border-2:#c6cec9;

  /* The navigation rail: one dark furniture element in both themes. Its
     tokens are separate from --panel/--text so nothing on a content surface
     accidentally inherits rail contrast. */
  --rail:#101720; --rail-2:#16202c; --rail-line:#232f3d;
  --rail-text:#dbe4ee; --rail-dim:#93a2b4; --rail-mute:#6d7c8f;
  --rail-hover:rgba(255,255,255,.055); --rail-active:rgba(62,181,159,.16);
  --rail-hi:#6fdcbf; /* the one bright colour allowed on the rail */

  --accent:#0f6e5c; --accent-2:#0a5245; --accent-3:#3eb59f; --accent-ink:#ffffff; --accent-soft:#e5f2ee;
  --accent-gradient:linear-gradient(135deg,#0f6e5c 0%,#3eb59f 100%);
  --ring:0 0 0 3px rgba(15,110,92,.22);
  /* Visible keyboard focus (WCAG 2.1 SC 2.4.7; master §47 names both keyboard
     navigation and visible focus states). The indicator is an `outline`, not
     a `box-shadow` on its own, because forced-colors / Windows high-contrast
     mode drops shadows but keeps outlines. Declared in both themes so the
     focus colour follows the theme; tools/a11y_audit.mjs asserts it. */
  --focus-outline:2px solid var(--accent); --focus-offset:2px;
  --ok:#1f7a44; --ok-2:#2f9d5a; --ok-soft:#e4f3e9;
  --warn:#a45a06; --warn-2:#c97d18; --warn-soft:#fbf0dd;
  --danger:#c02626; --danger-2:#e04545; --danger-soft:#fcecec;
  --info:#0a6ea8; --info-2:#1e9ad6; --info-soft:#e3f1fa;
  /* Ink for text that sits ON a filled colour. The dark theme's filled
     colours are light pastels, so white on them fails contrast; each state
     names the ink that reads on it rather than assuming white. */
  --on-ok:#ffffff; --on-warn:#ffffff; --on-danger:#ffffff; --on-info:#ffffff;

  /* Semantic content type colors */
  --kb:#6d4aff; --kb-soft:#efeaff; --kb-gradient:linear-gradient(135deg,#6d4aff 0%,#a855f7 100%);
  --sop:#2563eb; --sop-soft:#e7effd; --sop-gradient:linear-gradient(135deg,#2563eb 0%,#38bdf8 100%);
  --cl:#0f766e; --cl-soft:#e2f2f0; --cl-gradient:linear-gradient(135deg,#0f766e 0%,#34d399 100%);
  --tpl:#b45309; --tpl-soft:#f9efdc; --tpl-gradient:linear-gradient(135deg,#b45309 0%,#fbbf24 100%);
  --calc:#0d9488; --calc-soft:#dcf4f1; --calc-gradient:linear-gradient(135deg,#0d9488 0%,#2dd4bf 100%);
  --dec:#be185d; --dec-soft:#fbe9f2; --dec-gradient:linear-gradient(135deg,#be185d 0%,#f43f5e 100%);
  --kpi:#c2410c; --kpi-soft:#fbeee2; --kpi-gradient:linear-gradient(135deg,#c2410c 0%,#fb923c 100%);
  --scen:#6d28d9; --scen-soft:#eeeaff; --scen-gradient:linear-gradient(135deg,#6d28d9 0%,#c084fc 100%);
  --gloss:#475569; --gloss-soft:#eef1f5; --gloss-gradient:linear-gradient(135deg,#475569 0%,#94a3b8 100%);
  --academy:#0f6e5c; --academy-soft:#e5f2ee; --academy-gradient:linear-gradient(135deg,#0f6e5c 0%,#3eb59f 100%);
  --ops:#0d9488; --ops-soft:#dcf4f1; --ops-gradient:linear-gradient(135deg,#0d9488 0%,#2dd4bf 100%);

  --r-xs:8px; --r-sm:10px; --r:14px; --r-lg:20px; --r-xl:26px; --r-pill:999px;
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px;
  --space-5:20px; --space-6:24px; --space-7:32px; --space-8:40px;
  --sh:0 1px 2px rgba(17,21,28,.05);
  --sh-1:0 1px 2px rgba(17,21,28,.05),0 10px 26px rgba(17,21,28,.08);
  --sh-2:0 20px 54px rgba(17,21,28,.16);
  --sh-glow:0 0 0 1px rgba(15,110,92,.16),0 6px 18px rgba(15,110,92,.12);
  --side:288px; --top:60px;
  /* Two widths do different jobs: the page box holds a dashboard's grid, the
     measure holds a paragraph. Letting prose run to 1240px is why the old
     layout was tiring to read. */
  --page-max:1440px; --measure:74ch;
  --ease:cubic-bezier(.16,1,.3,1); --ease-out:cubic-bezier(.22,1,.36,1); --dur:.18s;
}
html[data-theme="dark"]{
  --bg:#0b1016; --bg-2:#0e141b; --panel:#131b24; --panel-2:#18222d; --sunken:#0a0f14;
  --text:#e8eef5; --dim:#adbdcf; --mute:#7e8ea0;
  --border:#25323f; --border-2:#3a4c5e;
  --rail:#080d12; --rail-2:#0d141b; --rail-line:#1d2833;
  --rail-text:#dbe4ee; --rail-dim:#93a2b4; --rail-mute:#6d7c8f;
  --accent:#4ec2a8; --accent-2:#7fd9c2; --accent-3:#3eb59f; --accent-ink:#06231c; --accent-soft:rgba(78,194,168,.15);
  --accent-gradient:linear-gradient(135deg,#3eb59f 0%,#7fd9c2 100%);
  --ring:0 0 0 3px rgba(78,194,168,.28);
  /* The focus ring has to be readable on a dark canvas too, so the token is
     re-declared here rather than inherited from :root. */
  --focus-outline:2px solid var(--accent); --focus-offset:2px;
  --ok:#4cc38a; --ok-2:#7fdcaa; --ok-soft:#12291d;
  --warn:#e6b45c; --warn-2:#f2cd8a; --warn-soft:#2b2113;
  --danger:#f2838b; --danger-2:#f8b0b5; --danger-soft:#2d1618;
  --info:#6cc8f0; --info-2:#9cdbf6; --info-soft:#0f2634;
  /* The filled states are light in this theme, so their ink is dark. */
  --on-ok:#06231c; --on-warn:#241806; --on-danger:#2b0808; --on-info:#04222f;

  --kb:#b9a8ff; --kb-soft:#2a2350; --kb-gradient:linear-gradient(135deg,#b9a8ff 0%,#c4b5fd 100%);
  --sop:#9ec1ff; --sop-soft:#1a2a48; --sop-gradient:linear-gradient(135deg,#9ec1ff 0%,#bfdbfe 100%);
  --cl:#6fd3c7; --cl-soft:#123435; --cl-gradient:linear-gradient(135deg,#6fd3c7 0%,#a7f3d0 100%);
  --tpl:#e8c476; --tpl-soft:#3a2f14; --tpl-gradient:linear-gradient(135deg,#e8c476 0%,#fde68a 100%);
  --calc:#6fd3c7; --calc-soft:#123733; --calc-gradient:linear-gradient(135deg,#6fd3c7 0%,#99f6e4 100%);
  --dec:#f0a4d2; --dec-soft:#3a1c2d; --dec-gradient:linear-gradient(135deg,#f0a4d2 0%,#fda4af 100%);
  --kpi:#f2b866; --kpi-soft:#3a2a10; --kpi-gradient:linear-gradient(135deg,#f2b866 0%,#fed7aa 100%);
  --scen:#c4b5fd; --scen-soft:#2a2350; --scen-gradient:linear-gradient(135deg,#c4b5fd 0%,#fdba74 100%);
  --gloss:#cbd5e1; --gloss-soft:#1e293b; --gloss-gradient:linear-gradient(135deg,#cbd5e1 0%,#e2e8f0 100%);
  --academy:#4ec2a8; --academy-soft:#123435; --academy-gradient:linear-gradient(135deg,#3eb59f 0%,#7fd9c2 100%);
  --ops:#6fd3c7; --ops-soft:#123733; --ops-gradient:linear-gradient(135deg,#6fd3c7 0%,#99f6e4 100%);

  --sh:0 1px 2px rgba(0,0,0,.5);
  --sh-1:0 2px 10px rgba(0,0,0,.5),0 14px 32px rgba(0,0,0,.45);
  --sh-2:0 20px 54px rgba(0,0,0,.6);
  --sh-glow:0 0 0 1px rgba(78,194,168,.22),0 6px 18px rgba(78,194,168,.16);
}
